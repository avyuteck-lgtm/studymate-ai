<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1D5BE0"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="StudyMate"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"></head><body>
<title>StudyMate AI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sidebar + working column on desktop, tab bar on phones. Blue and white, with amber as the one warm highlighter. */
:root{
  --bg:#EEF3FC; --surface:#FFFFFF; --surface2:#E3ECFA; --ink:#0C1B3D; --ink2:#52628A; --line:#D3DFF3;
  --accent:#1D5BE0; --accent-ink:#FFFFFF; --accent-soft:#DAE7FF; --hi:#FFC53D; --hi-soft:rgba(255,197,61,.42);
  --bar:#A8C1F0; --good:#12865A; --warn:#A96A00; --bad:#D6403F; --good-soft:#DAF3E8; --bad-soft:#FBE3E2;
  --shadow:0 1px 2px rgba(12,27,61,.06),0 8px 24px rgba(29,91,224,.09);
  --f-display:"Familjen Grotesk","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#081226; --surface:#0F1C38; --surface2:#172950; --ink:#E8EEFC; --ink2:#9DB0D6; --line:#22386A;
  --accent:#6B9DFF; --accent-ink:#04112E; --accent-soft:#16316A; --hi:#FFC53D; --hi-soft:rgba(255,197,61,.28);
  --bar:#365CA6; --good:#4FD1A0; --warn:#F0B54D; --bad:#FF7B78; --good-soft:#0F3A2C; --bad-soft:#44201F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#081226; --surface:#0F1C38; --surface2:#172950; --ink:#E8EEFC; --ink2:#9DB0D6; --line:#22386A;
  --accent:#6B9DFF; --accent-ink:#04112E; --accent-soft:#16316A; --hi:#FFC53D; --hi-soft:rgba(255,197,61,.28);
  --bar:#365CA6; --good:#4FD1A0; --warn:#F0B54D; --bad:#FF7B78; --good-soft:#0F3A2C; --bad-soft:#44201F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:auto}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(1.6rem,4vw,2.2rem);font-weight:700}
h2{font-size:1.2rem;font-weight:600}
h3{font-size:1rem;font-weight:600}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mark{background:linear-gradient(transparent 62%,var(--hi-soft) 62%);padding:0 .15em;margin-left:-.15em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink2)}
.small{font-size:.85rem}
.tiny{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);font-weight:600}

.app{display:grid;grid-template-columns:1fr;max-width:1240px;margin:0 auto;gap:0 28px;min-height:100%}
.side{display:none}
.col{min-width:0;padding-block:16px 96px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:1.15rem;text-decoration:none;color:var(--ink)}
.brand .logo{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.brand .logo svg{width:18px;height:18px}
@media(min-width:900px){
  .app{grid-template-columns:220px minmax(0,1fr)}
  .side{display:flex;flex-direction:column;gap:18px;position:sticky;top:env(safe-area-inset-top,0px);align-self:start;max-height:calc(100vh - env(safe-area-inset-top,0px));overflow:auto;padding-block:22px}
  .col{padding-block:22px 48px}
  .top{display:none}
  .tabbar{display:none!important}
}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:var(--ink2);text-decoration:none;font-weight:500}
.nav a svg,.tabbar svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav a:hover{background:var(--surface2);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.nav a[aria-current="page"] svg{color:var(--accent)}
.sidefoot{display:flex;flex-direction:column;gap:8px;margin-top:auto}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabbar a,.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border:0;background:none;color:var(--ink2);text-decoration:none;font-size:.7rem;font-weight:500;cursor:pointer;border-radius:10px}
.tabbar a[aria-current="page"]{color:var(--accent);font-weight:600}
.more{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;min-width:180px}
.more a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--ink);text-decoration:none}
.more svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.stack{display:flex;flex-direction:column;gap:18px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:18px}
.split{display:grid;gap:18px;grid-template-columns:1fr}
@media(min-width:1000px){.split{grid-template-columns:300px minmax(0,1fr)}}
.pagehead{display:flex;flex-direction:column;gap:6px}
.pagehead .sub{color:var(--ink2);max-width:62ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.card.flat{box-shadow:none}
.card.lift{box-shadow:var(--shadow)}
.card > h2,.card > .cardhead{margin-bottom:12px}
.cardhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer;text-decoration:none;min-height:40px}
.btn:hover{filter:brightness(1.07)}
.btn[disabled]{opacity:.5;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--surface2)}
.btn.quiet{background:transparent;border-color:transparent;color:var(--accent);padding-inline:10px}
.btn.quiet:hover{background:var(--accent-soft)}
.btn.danger{color:var(--bad)}
.btn.small{padding:6px 12px;min-height:34px;font-size:.88rem}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;background:var(--surface2);color:var(--ink2);font-size:.78rem;font-weight:600;white-space:nowrap}
.chip.accent{background:var(--accent-soft);color:var(--accent)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.hi{background:var(--hi-soft);color:var(--ink)}

.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.lbl{font-size:.8rem;font-weight:600;color:var(--ink2)}
input[type=text],input[type=date],input[type=number],select,textarea{width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);min-height:40px}
textarea{resize:vertical;line-height:1.55}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);flex:none}
.seg{display:inline-flex;background:var(--surface2);padding:3px;border-radius:11px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 14px;border-radius:9px;cursor:pointer;font-weight:500;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.formgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}

.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));background:var(--surface);border:1px solid var(--line);border-radius:14px}
.strip .stat{padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -1px -1px 0}
.stat b{font-family:var(--f-display);font-size:1.6rem;line-height:1.1}
.stat b small{font-size:.9rem;color:var(--ink2);font-weight:500}
.bar{height:7px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.bar.warn>i{background:var(--hi)}
.ring text{font-family:var(--f-display);font-weight:700;fill:var(--ink)}

.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.task{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.task.done .tl{text-decoration:line-through;color:var(--ink2)}
.task .tl{flex:1;min-width:0;display:flex;flex-direction:column}
.task .tl span{overflow-wrap:anywhere}
.badge{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;padding:2px 8px;border-radius:6px;background:var(--surface2);color:var(--ink2)}
.badge.learn{background:var(--accent-soft);color:var(--accent)}
.badge.quiz{background:var(--hi-soft);color:var(--ink)}
.badge.mock{background:var(--bad-soft);color:var(--bad)}
.empty{padding:22px;border:1.5px dashed var(--line);border-radius:14px;text-align:center;color:var(--ink2);display:flex;flex-direction:column;gap:10px;align-items:center}
.notice{padding:10px 14px;border-radius:10px;background:var(--hi-soft);font-size:.9rem}
.notice.bad{background:var(--bad-soft);color:var(--bad)}

.nitem{display:flex;flex-direction:column;gap:6px;padding:11px 12px;border-radius:12px;border:1px solid transparent;cursor:pointer;text-align:left;background:none;width:100%}
.nitem:hover{background:var(--surface2)}
.nitem[aria-current="true"]{background:var(--accent-soft);border-color:var(--accent)}
.nitem .nt{font-weight:600;overflow-wrap:anywhere}
.list{display:flex;flex-direction:column;gap:6px}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:12px;text-align:center;font-size:.88rem;color:var(--ink2)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}

.md{overflow-wrap:anywhere}
.md>*+*{margin-top:.7em}
.md h2,.md h3,.md h4,.md h5{font-size:1.02rem;margin-top:1.1em}
.md ul,.md ol{padding-left:1.3em;margin-block:.4em}
.md li+li{margin-top:.25em}
.md code{font-family:var(--f-mono);font-size:.88em;background:var(--surface2);padding:1px 5px;border-radius:5px}
.md hr{border:0;border-top:1px solid var(--line)}

.qprog{display:flex;align-items:center;gap:12px}
.qprog .bar{flex:1}
.qtext{font-family:var(--f-display);font-size:1.25rem;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.opts{display:flex;flex-direction:column;gap:10px}
.qopt{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;width:100%}
.qopt:hover:not([disabled]){border-color:var(--accent)}
.qopt .qkey{font-family:var(--f-mono);font-weight:500;min-width:24px;height:24px;border-radius:7px;display:grid;place-items:center;background:var(--surface2);font-size:.82rem;flex:none}
.qopt span:last-child{overflow-wrap:anywhere}
.qopt.right{border-color:var(--good);background:var(--good-soft)}
.qopt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.qopt[disabled]{cursor:default}
.flash{min-height:230px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px;padding:28px 20px;border:1px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:var(--shadow)}
.flash .ft{font-family:var(--f-display);font-size:1.3rem;font-weight:600;overflow-wrap:anywhere;max-width:60ch}
.flash .fb{font-size:1.02rem;overflow-wrap:anywhere;max-width:60ch;border-top:1px solid var(--line);padding-top:14px}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grades button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600}
.grades button small{font-weight:400;color:var(--ink2);font-size:.75rem}
.grades button:hover{border-color:var(--accent);background:var(--accent-soft)}

.chat{display:flex;flex-direction:column;gap:14px}
.msg{max-width:min(100%,78ch);padding:12px 14px;border-radius:14px;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px;white-space:pre-wrap}
.msg.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.thinking{display:inline-flex;gap:4px}
.thinking i{width:7px;height:7px;border-radius:50%;background:var(--ink2);animation:blink 1.1s infinite ease-in-out}
.thinking i:nth-child(2){animation-delay:.18s}.thinking i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.composer{display:flex;gap:10px;align-items:flex-end}
.composer textarea{min-height:46px}

.timer{font-family:var(--f-mono);font-size:clamp(3.4rem,14vw,5.6rem);font-weight:500;letter-spacing:-.02em;text-align:center;line-height:1}
.dayhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:6px 0 8px}
.dayhead h3.today{background:linear-gradient(transparent 62%,var(--hi-soft) 62%);padding:0 .15em;margin-left:-.15em}
.plans{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
.tbl th,.tbl td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2)}
.scroll-x{overflow-x:auto}

.ov{position:fixed;inset:0;z-index:50;background:rgba(8,14,20,.55);display:grid;place-items:center;padding:16px}
.dlg{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;max-width:460px;width:100%;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow);max-height:90%;overflow:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:500;max-width:min(92vw,460px);box-shadow:var(--shadow)}
@media(min-width:900px){.toast{bottom:28px}}
.mission{border-top:4px solid var(--accent);background:linear-gradient(180deg,var(--accent-soft),var(--surface) 110px)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- advanced features ---- */
:root{--c1:#1D5BE0;--c2:#D98A00;--c3:#0A8FC7;--c4:#D6403F;--c5:#6B4FD8;--c6:#12865A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--c1:#6B9DFF;--c2:#FFC53D;--c3:#5CC4F2;--c4:#FF7B78;--c5:#A99BFF;--c6:#4FD1A0}}
:root[data-theme="dark"]{--c1:#6B9DFF;--c2:#FFC53D;--c3:#5CC4F2;--c4:#FF7B78;--c5:#A99BFF;--c6:#4FD1A0}
.navgroup{padding:14px 12px 4px;font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);font-weight:600}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.85rem;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.cols3{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.simhead{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.simclock{font-family:var(--f-mono);font-size:1.7rem;font-weight:500;font-variant-numeric:tabular-nums}
.simclock.low{color:var(--bad)}
.simgrid{display:grid;gap:18px;grid-template-columns:1fr}
@media(min-width:960px){.simgrid{grid-template-columns:minmax(0,1fr) 260px}}
.palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.pal{height:40px;border-radius:9px;border:1.5px solid var(--line);background:var(--surface2);cursor:pointer;font-family:var(--f-mono);font-weight:500;position:relative;color:var(--ink)}
.pal.seen{background:var(--surface)}
.pal.ans{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pal.cur{outline:2px solid var(--ink);outline-offset:2px}
.pal.flag::after{content:"";position:absolute;top:3px;right:3px;width:9px;height:9px;border-radius:50%;background:var(--hi);border:1.5px solid var(--surface)}
.qopt.sel{border-color:var(--accent);background:var(--accent-soft)}
.graph{width:100%;height:auto;display:block;touch-action:manipulation}
.gnode{cursor:pointer}
.gnode:focus{outline:none}
.gnode:hover .gc,.gnode:focus .gc{stroke:var(--ink);stroke-width:3}
.glabel{font-size:11px;fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:3.5px;stroke-linejoin:round;font-weight:600;font-family:var(--f-body)}
.elabel{font-size:10px;fill:var(--ink2);paint-order:stroke;stroke:var(--surface);stroke-width:3px;font-family:var(--f-body)}
details.rev{border-top:1px solid var(--line);padding:10px 0}
details.rev summary{cursor:pointer;font-weight:600;overflow-wrap:anywhere}
.mini{display:flex;align-items:center;gap:10px}
.mini .bar{flex:1}
.stk>*+*{margin-top:8px}
</style>

<div id="app"></div>

<script>
(function(){
'use strict';

/* ---------- tiny helpers ---------- */
var LS_KEY='studymate.v1', LS_TIMER='studymate.timer';
var FREE={notes:3,ai:5,exams:1,pdfPages:10}, PREMIUM_PDF=300;
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
function h(tag,attrs){
  var e=document.createElement(tag);
  if(attrs){Object.keys(attrs).forEach(function(k){
    var v=attrs[k]; if(v==null||v===false) return;
    if(k==='class') e.className=v;
    else if(k==='html') e.innerHTML=v;
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v===true?'':v);
  });}
  for(var i=2;i<arguments.length;i++) add(e,arguments[i]);
  return e;
}
function add(e,k){
  if(k==null||k===false) return;
  if(Array.isArray(k)) return k.forEach(function(x){add(e,x)});

      if(n) await pr.collection('notes').doc(ids[i]).set(JSON.parse(JSON.stringify(n)));
      dirtyNotes.delete(ids[i]);

  var inl=function(s){return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>')};

  src.split('\n').forEach(function(raw){
    var l=raw.trimEnd();
    if(!l.trim()){close();return}
    if((m=l.match(/^(#{1,4})\s+(.*)/))){close();var lv=Math.min(5,m[1].length+1);out+='<h'+lv+'>'+inl(m[2])+'</h'+lv+'>'}

function localItems(text,n){

  var name=file.name||'Imported note', ext=(name.split('.').pop()||'').toLowerCase();
  if(file.size>15*1024*1024){toast('That file is over 15 MB. Split it or paste the text you need.');return}
  if(!canAddNote()) return;
  toast('Reading '+name+'…');
  var text='', extra='';
  try{
    if(ext==='pdf'){
      var lib=await loadPdfJs(), cap=S.premium?PREMIUM_PDF:FREE.pdfPages;
      var doc=await lib.getDocument({data:await file.arrayBuffer(),isEvalSupported:false}).promise;
      var pages=Math.min(doc.numPages,cap), out=[];

      text=out.join('\n\n');

      if(text.replace(/\s/g,'').length<40){toast('No readable text found. Scanned PDFs need text recognition. Paste the text instead.');return}
    } else if(ext==='txt'||ext==='md'||ext==='csv'||file.type.indexOf('text')===0){ text=await file.text(); }
    else {toast('Use a PDF, .txt or .md file, or paste your text.');return}
  }catch(e){toast('Could not read that file. Try pasting the text instead.');return}
  text=text.replace(/[ \t]+/g,' ').replace(/\n{3,}/g,'\n\n').trim();
  var cut=text.length>60000; if(cut) text=text.slice(0,60000);

  if(n){renderMain();toast('Added "'+n.title+'" ('+words(text).toLocaleString()+' words).'+extra+(cut?' Long text was trimmed to 60,000 characters.':''))}
}

function fmtDur(s){s=Math.round(s);return s>=60?Math.floor(s/60)+'m '+pad(s%60)+'s':s+'s'}
function fmtNum(n){return String(Math.round(n*100)/100)}
function cap1(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function topTerms(text,k){

  return Object.keys(f).sort(function(a,b){return f[b]-f[a]||b.length-a.length}).slice(0,k);
}
function goQuiz(id){ui.quizNote=id||'*';ui.practiceTab='quiz';Q=null;location.hash='#practice'}
function goCards(){ui.practiceTab='cards';location.hash='#practice'}
function cleanQs(arr,count){
  var seen={};
  return (Array.isArray(arr)?arr:[]).map(function(x){
    if(!x||typeof x.q!=='string'||!Array.isArray(x.options)||x.options.length!==4||typeof x.answer!=='number'||x.answer<0||x.answer>3) return null;
    if(seen[x.q]) return null; seen[x.q]=1;
    var right=String(x.options[x.answer]), opts=shuffle(x.options.map(String));
    return {q:x.q,options:opts,answer:opts.indexOf(right),explain:String(x.explain||''),topic:String(x.topic||'General').slice(0,40),src:String(x.source||'')};
  }).filter(Boolean).slice(0,count);

async function aiQuestions(ids,count,diff,focus,signal){

}
async function aiQuestionsChunked(ids,count,diff,focus,signal){
  var parts=[],left=count; while(left>0){var c=Math.min(15,left);parts.push(c);left-=c}
  var res=await Promise.all(parts.map(function(c){return aiQuestions(ids,c,diff,focus,signal)}));

}
function applyMastery(ids,qs,oks){

  qs.forEach(function(q,i){
    if(oks[i]===null||oks[i]===undefined) return;
    var nid=ids.length===1?ids[0]:(S.notes.find(function(n){return n.title===q.src})||{}).id;
    (nid?[nid]:ids).forEach(function(id){var p=per[id]||(per[id]={ok:0,n:0,miss:[]});p.n++;if(oks[i])p.ok++;else p.miss.push(q.topic)});
  });

    var p=per[id], pct=Math.round(p.ok/p.n*100), m=S.mastery[id]||(S.mastery[id]={score:0,attempts:0,last:'',misses:{}});
    m.score=m.attempts?Math.round(.5*m.score+.5*pct):pct; m.attempts++; m.last=today(); m.misses=m.misses||{};

async function startQuiz(ids,count,diff,focus){

  Q={state:'loading',ids:ids,diff:diff,focus:focus||'',ctl:ctl,qs:[],i:0,ans:[],t0:Date.now(),ai:false};
  var mine=Q, qs=null; renderMain();
  if(SAMPLE){
    if(!spend(1)){Q=null;renderMain();return}
    try{qs=await aiQuestions(ids,count,diff,focus,ctl.signal);mine.ai=qs.length>0}
    catch(e){refund(1);if(e.code==='cancelled')return;toast(aiMsg(e)+' Using offline questions instead.')}
  }
  if(Q!==mine) return;
  if(!qs||!qs.length) qs=localQuiz(mat,count);
  if(!qs.length){Q=null;toast('Could not build questions from this text. Add more detail.');renderMain();return}
  Q.qs=qs;Q.state='run';Q.t0=Date.now();Q.ans=[];Q.i=0;
  renderMain();
}
function finishQuiz(){
  var correct=0,total=Q.qs.length,oks=[],missedTopics=[],mis=[];

    var ok=Q.ans[i]===q.answer; oks.push(ok); if(ok) correct++;

  });

  if(!Q.retest&&!Q.assignment) applyMastery(Q.ids,Q.qs,oks);
  if(Q.focus&&Q.ids.length===1) conceptUpdate(Q.ids[0],Q.focus,pct);
  if(Q.retest) retestUpdate(oks); else if(!Q.assignment) addMistakes(mis);
  S.quizzes.push({id:uid(),date:today(),ids:Q.ids,score:correct,total:total,diff:Q.diff,ai:Q.ai}); if(S.quizzes.length>100)S.quizzes=S.quizzes.slice(-100);

}

var F={noteId:'',concept:'',text:'',busy:false,result:null,follow:'',fres:null,fbusy:false};
function coverage(n,text){

}
